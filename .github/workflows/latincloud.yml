# Publishes main to the LatinCloud hosting (www.bda-realty.com) over FTP.
# Needs the repository secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD.
# Optional repository variables: FTP_DIR (default ./htdocs/) and FTP_PROTOCOL (default ftps).
name: Publicar en LatinCloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: latincloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip until the FTP secrets are set
        if: env.FTP_SERVER == ''
        run: echo "Faltan los secretos FTP_SERVER, FTP_USERNAME y FTP_PASSWORD; no se publica."
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.FTP_SERVER != ''
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_DIR || './htdocs/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            vercel.json
